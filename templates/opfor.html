{% extends "base.html" %}
{% block title %}OPFOR Dashboard{% endblock %}
{% block content %}
<h1>OPFOR Dashboard</h1>
<form id="opfor-filters" class="filters">
  <label>Type <select name="type"><option value="all">All</option><option value="red">Red</option><option value="white">White</option></select></label>
  <label>Day <select name="day"><option value="all">All</option><option value="1">1</option><option value="2">2</option></select></label>
  <label>Team <select name="team"><option value="all">All</option><option>Blue Team A</option><option>Blue Team B</option></select></label>
  <button type="button" id="refresh">Refresh</button>
  <label class="inline"><input type="checkbox" id="auto-refresh"> Auto-refresh (30s)</label>
</form>
<div class="columns">
  <section class="column"><h2>Not started</h2><div data-status="not-started"></div></section>
  <section class="column"><h2>Running</h2><div data-status="running"></div></section>
  <section class="column"><h2>Stopped</h2><div data-status="stopped"></div></section>
</div>
{% endblock %}
