<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MATT Prototype{% endblock %} · {{ event.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="banner">{{ event.classification }} · TRAINING DATA ONLY</div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">MATT <span>prototype</span></a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if active == 'home' }}">Home</a>
      <a href="{{ url_for('assessment') }}" class="{{ 'active' if active == 'assessment' }}">Assessment</a>
      <a href="{{ url_for('task_wheel') }}" class="{{ 'active' if active == 'wheel' }}">Task Wheel</a>
      <a href="{{ url_for('opfor') }}" class="{{ 'active' if active == 'opfor' }}">OPFOR</a>
    </nav>
    <div class="meta">{{ event.name }} · Day {{ event.day }} · {{ event.user }} <button class="demo" disabled>CHAT (DEMO)</button></div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
